{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load django_bootstrap5 %}
  {% bootstrap_css %}
  <title>EmPath {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'SearchTracker/styles/base.css' %}">
  <link rel="stylesheet" href="{% static 'SearchTracker/styles/sidebar.css' %}">
  {% block styles %}{% endblock %}
</head>

<body>
  <main>
    {% include "SearchTracker/components/sidebar.html" %}
    <div class="main-content">
      {% block body %}{% endblock %}
    </div>
  </main>
  {% bootstrap_javascript %}
  {% block scripts %}{% endblock %}
  <script>
    window.addEventListener('beforeunload', () => {
      const closeUrl = "{% url 'SearchTracker:close' %}";
      navigator.sendBeacon(closeUrl, "");
    });
  </script>
</body>

</html>
